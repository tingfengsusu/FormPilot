# 消息驱动接入配置（**示例**；复制成 gateway.yaml 后填自己的凭据）
#
# 注意：gateway.yaml 已加入 .gitignore（含 App Secret），不要提交。
#       cp config/gateway.example.yaml config/gateway.yaml

# —— 飞书企业自建应用（事件订阅选「长连接」）——
# 创建步骤：开放平台 → 创建企业自建应用 → 事件订阅「长连接」+
#   订阅事件 im.message.receive_v1 → 权限 im:message / im:resource → 发布并加机器人进群
feishu:
  app_id: ""            # 例如 cli_a1b2c3d4e5f6g7h8
  app_secret: ""        # 开放平台「凭证与基础信息」里的 App Secret
  log_level: INFO       # DEBUG 可看长连接心跳

# —— 存储 ——
storage:
  db_path: data/gateway.db
  screenshot_dir: data/screenshots/gateway

# —— 队列与重试（设计文档：初期 SQLite + 单 worker，不上 Redis）——
queue:
  name: default
worker:
  max_retries: 3              # 用尽 → ALERT（异常预警）
  retry_backoff_seconds: 5    # 指数退避：5s / 10s / 20s

# —— 异常预警（重试耗尽 / 连续失败时 @负责人）——
alert:
  mention: ""                 # 飞书 open_id（填 all = @所有人）；留空只发文本
  consecutive_failures: 3     # 连续失败多少条 → 额外告警一次

# —— 台账（提效数据：设计文档第七节的 manual_seconds / auto_seconds）——
ledger:
  manual_seconds_per_record: 240   # 人工逐字段录入一条的预估耗时（秒）
                                   # 报表会算「平均每单省 X 分钟 / 累计省 Y 小时」

# —— 执行层（executor/）——
executor:
  # 保险期间起的最早日期（实测：投保页日期列从「明天」开始）
  #   tomorrow / today / YYYY-MM-DD / off
  period_start_floor: tomorrow

# —— 品种：消息文本里的关键词 → 用哪个品种、哪个来源识别附件、字段怎么映射 ——
# 发「学平险」+ 一张证件照 → 自动识别 → 填投保页 → 回推截图
#
# 字段来源三档（后者覆盖前者）：
#   1. field_map        —— 从附件 OCR 出来的字段
#   2. extra_properties —— 照片里没有的固定值（学校/类别等）
#   3. 消息里的 k=v     —— 临时覆盖，如「学平险 班级=2班 监护人电话=13900000000」
varieties:
  学平险:
    product: 太保洛阳学平险_基础     # config/product_library/ 下的品种
    ocr_source: 身份证OCR           # 附件用哪个属性来源识别（sources/）
    field_map:                      # OCR 字段 → 品种属性
      姓名: 学生姓名
      身份证号: 学生身份证号
    auto_period: true               # 保险期间起 = 明天（页面允许的最早值）；
                                    # 止 = 起 + 364 天（页面自动算，只回读核对）
    extra_properties:               # 照片里没有的字段：**按你的实际情况改**
      学校名称: 柳泉小学
      学生类别: 小学生
      年级: 1年级
      班级: 1班
      监护人姓名: 家长
      监护人电话: "13800000000"
  # 完全离线的品种：指向本地 mock 页面，演示/自测不必碰真实投保页
  本地测试:
    product: 学平险_本地Mock测试
    ocr_source: 身份证OCR
    field_map:
      姓名: 学生姓名
      身份证号: 学生身份证号
    extra_properties:               # 证件照里没有的字段（演示用固定值）
      监护人姓名: 演示家长
      监护人电话: "13800000000"
      保险方案: 基础版（100元）
  12306:
    product: 在线验证_12306余票查询
    ocr_source: Excel名单
    field_map: {}
