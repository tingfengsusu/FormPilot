# 导入列名映射 —— 源表列名可能不规范（OCR 产物/人工整理），支持多别名。
#
# 匹配顺序：精确匹配列名 → 归一化匹配（去空白/全角转半角）→ 包含匹配。
# 命中多个时按**本文件中别名的先后顺序**取第一个（越具体的写法放越前面）。
#
# 实测数据源列结构（records_final.xlsx，119 条，15 列）：
#   序号 / 投保人姓名 / 缴款人姓名 / 缴款人身份证 / 缴款人手机号 /
#   被保人姓名 / 被保人身份证 / 被保人手机号 / 学校（保留原名）/ 年级 /
#   班级 / 保险期限 / 申请状态 / 缴费状态 / 备注

columns:
  name:            [被保人姓名, 学生姓名, 姓名, 被保险人姓名, 学生名字]
  id_card:         [被保人身份证, 学生身份证号, 身份证号, 身份证, 证件号, 被保险人身份证]
  phone:           [被保人手机号, 学生手机号, 手机号, 手机, 家长电话, 联系电话]

  payer_name:      [缴款人姓名, 家长姓名, 监护人姓名, 投保家长姓名]
  payer_id_card:   [缴款人身份证, 家长身份证, 监护人身份证号]
  payer_phone:     [缴款人手机号, 家长手机号, 监护人电话]

  applicant_name:  [投保人姓名, 投保人]

  school:          [学校（保留原名）, 学校, 就读学校, 学校名称]
  grade:           [年级, 就读年级]
  class_name:      [班级, 年级班级, 所在班级]

  # 保险期限的两种形态：整列文本（"8.22-8.21"）或已拆分的起止日期
  period:          [保险期限, 保险期间, 投保期间, 保障期限]
  period_start:    [保险起期, 起始日期, 开始日期, 保险期间起]
  period_end:      [保险止期, 结束日期, 截止日期, 保险期间止]

  # 上游 OCR 的原图路径（复核时对照原图用；没有该列则不显示原图栏）
  source_image:    [原图, 原图路径, 图片, 扫描件, 台账图片]

ignore_columns: [序号, 申请状态, 缴费状态, 备注]

# 识别成占位符的值 → 当作空（附录 B.2：Excel 里的「（投保人姓名）」是
# 提示文字被 OCR 识别进来了，不是真实姓名，否则会当成名字填进系统）
ignore_placeholder_values:
  - "（投保人姓名）"
  - "(投保人姓名)"
  - "投保人姓名"
  - "（此处填写）"
  - "(此处填写)"
  - "（姓名）"
  - "-"
  - "—"
  - "/"
  - "无"
  - "N/A"
  - "NA"
