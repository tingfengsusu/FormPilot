# 学校别名表：台账/OCR 写法 → 网页下拉权威值（**需人工确认**）
#
# 权威值 = config/options_school.yaml 里页面下拉的选项文本（探针产出）。
# 本文件把台账里的 N 种写法映射到那些权威值上（附录 B.4 / C.4）。
#
# 实测：119 条里有 **19 种写法**，明显存在同校异名（"实验小"/"实验高"/"实验"）。
# 匹配不上的值会进「数据异常」并出现在导入报告的「未命中清单」里——**不猜**。
#
# ⚠️ 下面标「推测」的目标值是按附录 B.4 的推测填的，**拿到下拉选项后必须逐个核对**；
#    核对方法：先跑 tools/probe_options.py 产出 options_school.yaml，
#    再执行 `python tools/batch_cli.py aliases --check` 检查目标值是否都在选项集合内。

aliases:
  # 柳集（实测 67 / 12 / 4 条）
  "柳小": "柳集小学"
  "柳中": "柳集中学"
  "柳幼": "柳集幼儿园"

  # 实验（实测 4 / 1 / 1 条）
  "实验小": "实验小学"
  "实验高": "实验高中"

  # —— 以下写法的目标值待人工确认，确认后取消注释（现在留空 → 进「数据异常」）——
  # "实验":   "？"      # 1 条，可能是「实验小学」或「实验高中」的残缺值
  # "思源":   "？"      # 5 条
  # "一中":   "？"      # 5 条
  # "镇中":   "？"      # 3 条
  # "艺校":   "？"      # 2 条
  # "艺桥":   "？"      # 1 条
  # "清花园": "？"      # 1 条，台账原字迹疑似「清风园」
  # "双语":   "？"      # 1~2 条
  # "机车":   "？"      # 1~2 条
  # "洛铁":   "？"      # 1~2 条
  # "理工":   "？"      # 1~2 条
  # "香鹿":   "？"      # 1~2 条
  # "江南":   "？"      # 1~2 条
  # "郑庄":   "？"      # 1~2 条
