# 班级别名表：台账/OCR 写法 → 网页下拉权威值
#
# 权威值 = config/options_class.yaml 的**页面真实选项**（探针已产出：
# 1班…30班，自定义组件）。目标值全部落在选项集合内，
# 可用 `python tools/probe_options.py --check` 复核。
#
# 实测源数据的班级**已统一为 "N班"**（119 条全部是 "1班"），
# 所以本表只做「中文数字 → 阿拉伯数字」的形态归一：
# 防 OCR 把数字识别成中文数字（"一班"）、或漏掉"班"字。
#
# 注意：班级的号段需要与年级匹配（一年级一般只有 1~5 班），
# 本表不做业务推断，只做形态归一。

aliases:
  "一班": "1班"
  "二班": "2班"
  "三班": "3班"
  "四班": "4班"
  "五班": "5班"
  "六班": "6班"
  "七班": "7班"
  "八班": "8班"
  "九班": "9班"
  "十班": "10班"
  "十一班": "11班"
  "十二班": "12班"
