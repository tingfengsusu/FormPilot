# 班级别名表：台账/OCR 写法 → 网页下拉权威值
#
# 实测源数据的班级**已统一为 "N班"**（如 "1班"、"2班"），
# 所以这份表主要防 OCR 把数字识别成中文数字（"一班"）、或漏掉"班"字。
#
# 与学校/年级不同：班级的号段需要与年级匹配（一年级一般只有 1~5 班），
# 所以这里只做「中文数字 → 阿拉伯数字」的形态归一，不做业务推断。

aliases:
  "一班": "1班"
  "二班": "2班"
  "三班": "3班"
  "四班": "4班"
  "五班": "5班"
  "六班": "6班"
  "七班": "7班"
  "八班": "8班"
  "九班": "9班"
  "十班": "10班"
  "十一班": "11班"
  "十二班": "12班"
