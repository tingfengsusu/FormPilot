# 引擎的业务词汇（**数据，不是代码**）
#
# 引擎只懂"怎么操作页面"，不懂"学生姓名/年级/班级"这些业务词；
# 这些词属于某个录入场景，以数据形式放这里 —— 换场景改配置，不改引擎代码。
# （tests/test_architecture.py 会挡住"把业务词写回引擎 .py"的行为）

# —— 页面字段 → 品种属性的启发式关键词（LLM 不可用时的兜底匹配）——
matcher_keywords:
  学生姓名: [xm, name, 姓名, student]
  学生身份证号: [sfzh, idcard, 身份证, sfz, id]
  监护人姓名: [jhrmc, guardian, 监护人, jhr]
  监护人电话: [lxdh, phone, tel, 电话, dh, mobile]
  保险方案: [baoxian, plan, 方案, bx, scheme]
  保险员姓名: [bxyxm, agent, 保险员, 业务员]

# —— 规则引擎用的字段名与解析规则 ——
rule:
  grade_keys: [年级, 就读年级]
  class_keys: [班级]
  birth_keys: [出生日期]
  # 从班级/年级文本里解析年级数字（三年级二班 → 3、6年级 → 6）
  grade_pattern: '([一二三四五六七八九十]{1,3}|\d{1,2})\s*年级'
  # 年级区间 → 方案档位（文案与测试页 select 的 option 文本一致）
  grade_plan_map:
    - [1, 3, "基础版（100元）"]
    - [4, 6, "加强版（150元）"]
    - [7, 12, "尊享版（200元）"]

# —— 各数据源的字段清单（Mock/演示用）——
source_fields:
  Excel名单: [学校, 班级, 学生姓名, 监护人姓名, 监护人电话]

# —— Mock 数据（无网络/演示时用）——
mock:
  excel:
    学校: 洛阳市实验小学
    班级: 三年级二班
    学生姓名: 测试学生
    监护人姓名: 王大力
    监护人电话: "13800000000"

# —— 页面扫描的 Mock 字段（未装 Playwright 时演示用）——
scanner_mock_fields:
  - {locator: 'input[name="xm"]', placeholder: '请输入学生姓名', label: 学生姓名}
  - {locator: 'input[name="sfzh"]', placeholder: '请输入身份证号', label: 学生身份证号}
  - {locator: 'input[name="lxdh"]', placeholder: '请输入监护人电话', label: 监护人电话}
  - {locator: 'select[name="baoxian"]', placeholder: '', label: 保险方案}
