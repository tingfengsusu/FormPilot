# 年级别名表：台账/OCR 写法 → 网页下拉权威值（**需人工确认**）
#
# 权威值 = config/options_grade.yaml 的**页面真实选项**（探针已产出，2026-09-19）：
#   1年级 2年级 3年级 4年级 5年级 6年级
#   初中一年级 初中二年级 初中三年级
#   高中一年级 高中二年级 高中三年级
#   （实测：年级选项**不随「学生类别」变化**，三个类别下都是这 12 个）
#
# 目标值全部落在选项集合内，可用
# `python tools/probe_options.py --check` 复核。
#
# 实测台账里的 18 种写法（括号内为条数）：
#   二 32 ／ 一 21 ／ 五 20 ／ 四 13 ／ 三 11 ／ 六 10 ／
#   大三 1 ／ 大二 1 ／ 十一 1 ／ 九 1 ／ 八 1 ／ 大 1 ／ 大一 1 ／ 小 1 ／
#   高二 1 ／ 中 1 ／ 高三 1 ／ 高一 1

aliases:
  # —— 小学段：中文数字 → 页面上的阿拉伯数字写法（形态归一，无歧义）——
  "一": "1年级"
  "二": "2年级"
  "三": "3年级"
  "四": "4年级"
  "五": "5年级"
  "六": "6年级"
  # OCR 把中文数字识别成阿拉伯数字时同样命中
  "1": "1年级"
  "2": "2年级"
  "3": "3年级"
  "4": "4年级"
  "5": "5年级"
  "6": "6年级"

  # —— 高中段：简称 → 页面全称（形态归一，无歧义）——
  "高一": "高中一年级"
  "高二": "高中二年级"
  "高三": "高中三年级"

  # —— 大学段（使用者确认：录入时「学生类别」选「大中专学校学生」，
  #    年级再选 1/2/3）——
  "大一": "1年级"
  "大二": "2年级"
  "大三": "3年级"

# —— 以下写法**暂时留空**，导入时进「数据异常」（不猜）——
# "八": ""      # 1 条：八年级 = 初中二年级（6-3-3 学制）？需人工确认后再填
# "九": ""      # 1 条：同理，可能是初中三年级
# "大": ""      # 1 条，疑似 OCR 残缺值 —— 回看台账原图，不猜
# "小": ""      # 1 条，同上
# "中": ""      # 1 条，同上
# "十一": ""    # 1 条，小学没有十一 —— 疑为识别错误，回看原图
