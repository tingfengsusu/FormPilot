# 年级别名表：台账/OCR 写法 → 网页下拉权威值（**需人工确认**）
#
# 实测：119 条里有 **18 种写法**，语义上其实分两段（学段 + 年级）。
# 归一口径（附录 B.4）：
#     小学段 一~六  → "X年级"
#     中学段 八 九   → "初中X年级"      高一~高三 → "高中X年级"
#     大学段 大一~大三 → "大学X年级"
#     「大 / 小 / 中 / 十一」→ 疑似 OCR 残缺或原字迹不清，共 4 条 → **不猜，进数据异常**
#
# ⚠️ 目标值同样是推测，拿到页面下拉选项（config/options_grade.yaml）后必须核对。

aliases:
  # —— 小学段 ——
  "一": "一年级"
  "二": "二年级"
  "三": "三年级"
  "四": "四年级"
  "五": "五年级"
  "六": "六年级"
  "1": "一年级"
  "2": "二年级"
  "3": "三年级"
  "4": "四年级"
  "5": "五年级"
  "6": "六年级"

  # —— 中学段 ——
  "八": "初中二年级"          # 八年级 = 初中二年级
  "九": "初中三年级"
  "高一": "高中一年级"
  "高二": "高中二年级"
  "高三": "高中三年级"

  # —— 大学段 ——
  "大一": "大学一年级"
  "大二": "大学二年级"
  "大三": "大学三年级"

  # —— 以下为实测残缺值，**故意不映射**（不猜，导入后进「数据异常」）——
  # "大":  1 条
  # "小":  1 条
  # "中":  1 条
  # "十一": 1 条（小学没有十一，疑为识别错误）
