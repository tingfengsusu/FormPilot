<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>日期选择器验证页（Mock，Vant 风格滚轮）</title>
<style>
  body { font-family: sans-serif; margin: 24px; }
  .field { margin: 18px 0; }
  .value { display: inline-block; min-width: 140px; padding: 6px 10px;
           border: 1px solid #999; cursor: pointer; }
  #mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; }
  #picker { position: fixed; left: 0; right: 0; bottom: 0; background: #fff;
            display: none; z-index: 10; }
  .bar { display: flex; justify-content: space-between; padding: 10px 16px;
         border-bottom: 1px solid #eee; cursor: default; }
  .bar span { cursor: pointer; color: #1989fa; }
  .cols { display: flex; height: 180px; overflow: hidden; }
  .van-picker-column { flex: 1; list-style: none; margin: 0; padding: 0;
                       overflow-y: auto; height: 180px; text-align: center; }
  .van-picker-column__item { padding: 8px 0; color: #999; cursor: pointer; }
  .van-picker-column__item.selected { color: #333; font-weight: 600; }
</style>
</head>
<body>
  <h3>保险期限（日期选择器验证页，非真实页面）</h3>

  <div class="field">
    <label>起</label>
    <span class="value" id="startValue">请选择</span>
  </div>

  <div class="field">
    <label>止</label>
    <span class="value" id="endValue">请选择</span>
  </div>

  <div id="mask"></div>
  <div id="picker">
    <div class="bar"><span id="cancel">取消</span><span id="confirm">确认</span></div>
    <div class="cols">
      <ul class="van-picker-column" data-unit="year"></ul>
      <ul class="van-picker-column" data-unit="month"></ul>
      <ul class="van-picker-column" data-unit="day"></ul>
    </div>
  </div>

  <p><label>学生姓名</label> <input id="name" placeholder="请录入姓名"></p>

<script>
// 真实页面的约束：起期只能选今天及之后（更早的日期直接不渲染）
const TODAY = new Date();
const MIN_DAYS_AHEAD = 0;
// 复现真机的怪癖：Vant 滚轮出现过「点 20 日结果选中 21 日」（固定偏移）。
// 用 #offset=1 打开本页即可模拟，用于验证「回读 + 按差值修正」的闭环逻辑。
const OFFSET = (function () {
  const m = location.hash.match(/offset=(-?\d+)/);
  return m ? parseInt(m[1], 10) : 0;
})();
let currentField = null;
let selected = {year: TODAY.getFullYear(), month: TODAY.getMonth() + 1, day: TODAY.getDate()};

function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }

function fillColumn(unit, values) {
  const ul = document.querySelector('.van-picker-column[data-unit="' + unit + '"]');
  ul.innerHTML = '';
  values.forEach(function (v, index) {
    const li = document.createElement('li');
    li.className = 'van-picker-column__item' + (v === selected[unit] ? ' selected' : '');
    li.textContent = v + (unit === 'year' ? '年' : unit === 'month' ? '月' : '日');
    li.addEventListener('click', function () {
      // OFFSET != 0 时模拟真机的怪癖：**只有「日」列**出现过「点 20 日选中 21 日」
      const shift = (unit === 'day') ? OFFSET : 0;
      const target = values[Math.min(values.length - 1,
                                     Math.max(0, index + shift))];
      selected[unit] = target;
      if (unit === 'month' || unit === 'year') {
        const max = daysInMonth(selected.year, selected.month);
        if (selected.day > max) selected.day = max;
      }
      renderAll();
    });
    ul.appendChild(li);
  });
}

function renderAll() {
  const minDate = new Date(TODAY.getTime() + MIN_DAYS_AHEAD * 86400000);
  const years = [], months = [], days = [];
  for (let y = minDate.getFullYear(); y <= minDate.getFullYear() + 1; y++) years.push(y);
  for (let m = 1; m <= 12; m++) months.push(m);
  const maxDay = daysInMonth(selected.year, selected.month);
  for (let d = 1; d <= maxDay; d++) days.push(d);
  // 只在「今天」这一天下限；更早的日期不允许（真实页面同样处理）
  fillColumn('year', years);
  fillColumn('month', months.filter(m => selected.year > minDate.getFullYear() || m >= minDate.getMonth() + 1));
  fillColumn('day', days.filter(d =>
    selected.year > minDate.getFullYear()
    || selected.month > minDate.getMonth() + 1
    || d >= minDate.getDate()));
  document.querySelectorAll('.van-picker-column__item').forEach(li => {
    const unit = li.parentElement.dataset.unit;
    const num = parseInt(li.textContent, 10);
    if (num === selected[unit]) li.classList.add('selected');
  });
}

function openPicker(field) {
  currentField = field;
  const text = document.getElementById(field + 'Value').textContent;
  if (text && text !== '请选择') {
    const m = text.match(/(\d+)-(\d+)-(\d+)/);
    if (m) selected = {year: +m[1], month: +m[2], day: +m[3]};
  }
  renderAll();
  document.getElementById('mask').style.display = 'block';
  document.getElementById('picker').style.display = 'block';
}

function closePicker() {
  document.getElementById('mask').style.display = 'none';
  document.getElementById('picker').style.display = 'none';
}

document.getElementById('startValue').addEventListener('click', () => openPicker('start'));
document.getElementById('endValue').addEventListener('click', () => openPicker('end'));
document.getElementById('cancel').addEventListener('click', closePicker);
document.getElementById('confirm').addEventListener('click', function () {
  const pad = n => String(n).padStart(2, '0');
  document.getElementById(currentField + 'Value').textContent =
    selected.year + '-' + pad(selected.month) + '-' + pad(selected.day);
  closePicker();
});
</script>
</body>
</html>
